<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#233954" />
    <link rel="preload" href="/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /* Aplica o tema ANTES da primeira pintura: sem piscar branco no modo escuro. */
      (function () {
        try {
          var s = localStorage.getItem("frota.theme");
          var d = s ? s === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <script>
      /* Rede de segurança: se o app não aparecer em 8 s (ex.: versão antiga guardada no aparelho), limpa service worker e caches e recarrega UMA vez. */
      (function () {
        setTimeout(function () {
          var r = document.getElementById("root");
          if (!r || r.childElementCount > 0) return;
          try { if (sessionStorage.getItem("frota.recuperou")) { r.innerHTML = '<p style="font:16px sans-serif;padding:24px;text-align:center">Não consegui abrir o app. Tente Ctrl + Shift + R.</p>'; return; } sessionStorage.setItem("frota.recuperou", "1"); } catch (e) {}
          var fim = function () { location.reload(); };
          var apagar = function () { if (!window.caches) return fim(); caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(fim, fim); };
          if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (x) { return x.unregister(); })); }).then(apagar, apagar); else apagar();
        }, 8000);
      })();
    </script>
    <title>Frota</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
